# Matrix Synapse Configuration for CipherChat 3.0
server_name: "cipherchat.local"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client, federation]
        compress: true

database:
  name: psycopg2
  args:
    user: synapse_user
    password: ChangeMeSecureDbPassword123!
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 20

# Media store
media_store_path: /data/media_store
max_upload_size: 100M
url_preview_enabled: false

# End-to-End Encryption Configuration
enable_e2ee: true
encryption_default_for_new_rooms: true

# Registration & Security
enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: "ChangeMeRegistrationSharedSecretCipherChat30"
bcrypt_rounds: 12
allow_guest_access: false

# VoIP & Coturn STUN/TURN Integration
turn_uris:
  - "turn:cipherchat.local:3478?transport=udp"
  - "turn:cipherchat.local:3478?transport=tcp"
turn_shared_secret: "ChangeMeCoturnTurnSharedSecret30!"
turn_user_lifetime: "1h"
turn_allow_guests: false

# Rate Limiting
rc_message:
  per_second: 5
  burst_count: 20
rc_registration:
  per_second: 0.17
  burst_count: 3
rc_login:
  address:
    per_second: 0.5
    burst_count: 5
  account:
    per_second: 0.5
    burst_count: 5

# Metadata Minimization & Logging
report_stats: false
federation_domain_whitelist: []
presence:
  enabled: true
