# Coturn Configuration for CipherChat 3.0
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49172

# Security & Shared Secret Authentication
use-auth-secret
static-auth-secret=ChangeMeCoturnTurnSharedSecret30!
realm=cipherchat.local

# Network restrictions - block access to RFC 1918 private networks to prevent pivoting
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

no-multicast-peers
fingerprint
lt-cred-mech
no-cli
no-tcp-relay
verbose
