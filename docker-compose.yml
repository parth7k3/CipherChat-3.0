services:
  postgres:
    image: postgres:16-alpine
    container_name: cipherchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: ${POSTGRES_USER:-synapse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecureDbPassword123!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cipherchat-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse_user} -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:v1.115.0
    container_name: cipherchat-synapse
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./docker/synapse/data:/data
      - ./docker/synapse/homeserver.yaml:/data/homeserver.yaml:ro
    networks:
      - cipherchat-internal
      - cipherchat-edge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: cipherchat-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: cipherchat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./dist:/usr/share/nginx/html:ro
    networks:
      - cipherchat-edge
    depends_on:
      - synapse

networks:
  cipherchat-internal:
    internal: true
    driver: bridge
  cipherchat-edge:
    driver: bridge

volumes:
  postgres_data:
    name: cipherchat_postgres_data
